name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=@prova/web... build
        env:
          # Placeholder only, never a real app id/secret: without it,
          # Providers.tsx skips rendering PrivyProvider and the build fails
          # prerendering any page that calls Privy's useWallets outside it.
          NEXT_PUBLIC_PRIVY_APP_ID: ci-build-placeholder-0000
      - name: Install Playwright browsers
        run: pnpm --filter=@prova/tests-e2e exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm --filter=@prova/tests-e2e test:e2e
        env:
          BASE_URL: http://localhost:3000
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7
